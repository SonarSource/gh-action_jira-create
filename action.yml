name: gh-action_jira-create
description: Create a new Jira issue
inputs:
  project:
    description: Key of the project
    required: true
  issuetype:
    description: "Type of the issue to be created. Example: 'Task'"
    required: true
  summary:
    description: Issue summary
    required: true
  description:
    description: Issue description
    required: false
  fields:
    description: Additional fields in JSON format
    required: false
outputs:
  issue:
    description: Key of the newly created issue
    value: ${{ steps.create.outputs.issue }}

runs:
  using: composite
  steps:
    - uses: peter-evans/jira2md@c723431952015df5d3cdc8e17b82cb66df5415db # v3.0.0
      id: md2jira
      with:
        input-text: ${{ inputs.description }}
        mode: md2jira
    - name: Create Jira issue
      id: create
      shell: bash
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_ISSUETYPE: ${{ inputs.issuetype }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_DESCRIPTION: ${{ steps.md2jira.outputs.output-text }}
        INPUT_FIELDS: ${{ inputs.fields }}
      run: |
        set -euo pipefail

        if [[ -z "${JIRA_BASE_URL:-}${JIRA_USER_EMAIL:-}${JIRA_API_TOKEN:-}" ]]; then
          jira_config="$HOME/jira/config.yml"
          if [[ -f "$jira_config" ]]; then
            read_jira_config_value() {
              awk -v key="$1" '
                $0 ~ "^" key ":" {
                  value = substr($0, index($0, ":") + 1)
                  sub(/^[[:space:]]*/, "", value)
                  sub(/[[:space:]]*$/, "", value)
                  if (value ~ /^".*"$/ || value ~ /^'\''.*'\''$/) {
                    value = substr(value, 2, length(value) - 2)
                  }
                  print value
                  exit
                }
              ' "$jira_config"
            }

            JIRA_BASE_URL="$(read_jira_config_value baseUrl)"
            JIRA_USER_EMAIL="$(read_jira_config_value email)"
            JIRA_API_TOKEN="$(read_jira_config_value token)"
          fi
        fi

        for variable in JIRA_BASE_URL JIRA_USER_EMAIL JIRA_API_TOKEN; do
          if [[ -z "${!variable:-}" ]]; then
            echo "::error::${variable} must be set by Jira Login or the environment."
            exit 1
          fi
        done

        extra_fields="${INPUT_FIELDS:-}"
        if [[ -z "$extra_fields" ]]; then
          extra_fields='{}'
        fi
        if ! jq -e 'type == "object"' >/dev/null <<<"$extra_fields"; then
          echo "::error::The fields input must be a JSON object."
          exit 1
        fi

        payload="$(
          jq -cn \
            --arg project "$INPUT_PROJECT" \
            --arg issuetype "$INPUT_ISSUETYPE" \
            --arg summary "$INPUT_SUMMARY" \
            --arg description "$INPUT_DESCRIPTION" \
            --argjson extra_fields "$extra_fields" \
            '{
              fields: (
                $extra_fields
                + {
                  project: {key: $project},
                  issuetype: {name: $issuetype},
                  summary: $summary
                }
                + if $description == "" then {} else {description: $description} end
              )
            }'
        )"

        response="$(
          curl --fail-with-body --silent --show-error \
            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${JIRA_BASE_URL%/}/rest/api/2/issue"
        )"
        issue_key="$(jq -er '.key' <<<"$response")"
        echo "issue=$issue_key" >> "$GITHUB_OUTPUT"
